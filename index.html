<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CPB 管路組裝</title>
<style>
:root{--bg:#0e1b26;--panel:#16293a;--line:#2c4559;--text:#eef4f8;--mute:#9db3c4;--ok:#3fb68b;--warn:#f0a43a;--bad:#e5484d;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f3f7fa;--panel:#fff;--line:#c5d4df;--text:#12222f;--mute:#4d6477;--ok:#1f8a65;--warn:#c27a10;--bad:#c92d33;color-scheme:light}}
*{box-sizing:inherit}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;font-size:clamp(16px,1.6vw,26px);line-height:1.5}
main{max-width:1600px;margin:0 auto;padding:.6rem 1.2rem 2rem}
header{display:flex;gap:1rem;align-items:center;justify-content:space-between;flex-wrap:wrap;border-bottom:2px solid var(--line);padding-bottom:.4rem}
h1{font-size:1.1em;margin:0}h2{font-size:1.4em;margin:.8rem 0 .3rem}
.hud{display:flex;gap:1.2rem;align-items:center;font-weight:700}
.bar{display:inline-block;vertical-align:middle;width:9em;height:.8em;background:var(--line);border-radius:1em;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);transition:width .4s,background .4s}
.game{display:grid;gap:1rem;margin-top:.6rem}
@media (min-width:1000px){.game{grid-template-columns:minmax(0,1.9fr) minmax(0,1fr);align-items:start}}
#dia{width:100%;height:auto;max-height:88vh;background:#fff;border-radius:.5em}
button{font:inherit;color:inherit;cursor:pointer;border:2px solid var(--line);background:var(--panel);border-radius:.5em;padding:.45em .6em}
button:focus-visible{outline:3px solid var(--warn);outline-offset:2px}
.tray{display:grid;grid-template-columns:repeat(auto-fit,minmax(9em,1fr));gap:.5rem}
.card{text-align:center;line-height:1.3}.card small{display:block;color:var(--mute);font-size:.7em}
.card.sel{border-color:var(--warn);background:var(--line)}.card.used{opacity:.2;pointer-events:none}
.msg{margin-top:.7rem;padding:.6em .9em;border-radius:.5em;background:var(--panel);border-left:8px solid var(--line);min-height:4.2em}
.msg.ok{border-color:var(--ok)}.msg.bad{border-color:var(--bad)}
.go{background:var(--ok);border-color:var(--ok);color:#06241a;font-weight:800;margin-top:.8rem;padding:.5em 1.2em}
.slot{cursor:pointer}.slot rect{fill:#dde6ee;stroke:#5d7385;stroke-width:2;stroke-dasharray:6 4}
.slot:hover rect,.slot:focus-visible rect{stroke:#d9820a;stroke-width:3}
.slot.done rect{fill:none;stroke:#1f9d6f;stroke-width:3;stroke-dasharray:none}
.slot .q{font-size:22px;font-weight:800;fill:#5d7385}.slot.done .q{display:none}
.tag{font-size:14px;font-weight:800;fill:#0d6b4b;stroke:#fff;stroke-width:4px;paint-order:stroke}
.shake{animation:sh .3s}@keyframes sh{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@media (prefers-reduced-motion:reduce){.shake{animation:none}}
.rev{border-left:6px solid var(--bad);padding:.2em .8em;margin:.6rem 0;background:var(--panel)}
</style>
</head>

<main>

const S={bp:100,sc:0,miss:[],sel:null,placed:[]};
function hud(){$('sc').textContent=S.sc;const b=$('bp');b.style.width=S.bp+'%';b.style.background=S.bp>60?'var(--ok)':S.bp>30?'var(--warn)':'var(--bad)'}
function say(t,c){const m=$('msg');m.textContent=t;m.className='msg '+(c||'')}
function intro(){hud();app.innerHTML='<h2>把 Fig. 50.13 的元件接回迴路</h2><p>圖上有 9 個元件被遮住了。先點右邊的元件，再點圖上要放的位置。接錯會讓「病人狀態」下降。</p><button class="go" id="st">開始</button>';$('st').onclick=start}
function start(){S.sel=null;S.placed=[];
 const slots=P.map((p,i)=>{const m=p[3];return `<g class="slot" data-i="${i}" tabindex="0" role="button" aria-label="遮住的元件 ${i+1}"><rect x="${m[0]}" y="${m[1]}" width="${m[2]}" height="${m[3]}" rx="4"/><text class="q" x="${m[0]+m[2]/2}" y="${m[1]+m[3]/2+8}" text-anchor="middle">?</text></g>`}).join('');
 app.innerHTML=`<div class="game"><svg id="dia" viewBox="0 0 809 603" role="img" aria-label="CPB 迴路圖"><image href="${FIG}" width="809" height="603"/>${slots}</svg>
 <div><div class="tray">${shuf(P).map(p=>`<button class="card" data-id="${p[0]}">${p[1]}<small>${p[2]}</small></button>`).join('')}</div>
 <div class="msg" id="msg">先選一個元件。沒選元件時點圖上的格子，可以看提示。</div><div id="nx"></div></div></div>`;
 document.querySelectorAll('.card').forEach(b=>b.onclick=()=>{S.sel=b.dataset.id;document.querySelectorAll('.card').forEach(x=>x.classList.toggle('sel',x===b));say('要放在圖上的哪一格？')});
 document.querySelectorAll('.slot').forEach(g=>{g.onclick=()=>place(g);g.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();place(g)}}})}
function place(g){
 const i=+g.dataset.i,c=P[i];if(S.placed.includes(i))return;
 if(!S.sel){say('這格的提示：'+c[5]);return}
 const p=P.find(x=>x[0]===S.sel);
 if(p[0]===c[0]){S.placed.push(i);S.sc+=10;g.classList.add('done');
  const t=document.createElementNS('http://www.w3.org/2000/svg','text');t.setAttribute('class','tag');t.setAttribute('x',c[4][0]);t.setAttribute('y',c[4][1]);t.setAttribute('text-anchor',c[4][2]);t.textContent=c[1];g.appendChild(t);
  document.querySelector(`.card[data-id="${p[0]}"]`).classList.add('used');S.sel=null;hud();say('✔ '+c[6],'ok');
  if(S.placed.length===P.length){say('✔ 全部接對了！','ok');$('nx').innerHTML='<button class="go" id="fin">看成績</button>';$('fin').onclick=end}
 }else{g.classList.remove('shake');void g.getBoundingClientRect();g.classList.add('shake');
  S.bp=Math.max(0,S.bp-8);S.miss.push('把「'+p[1]+'」放在「'+c[1]+'」的位置。'+c[6]);hud();say('✘ 這格不是「'+p[1]+'」。提示：'+c[5],'bad')}}
function end(){const r=S.bp>=80?'病人平穩，做得很好。':S.bp>=50?'血壓有些波動，但撐住了。':'病人狀況不穩，下面的錯誤值得討論。';
 app.innerHTML=`<h2>結果：${S.sc} 分，病人狀態 ${S.bp}%</h2><p>${r}</p><h2>錯誤回顧</h2>`+(S.miss.length?S.miss.map(m=>`<div class="rev">${m}</div>`).join(''):'<p>全部一次接對。</p>')+'<button class="go" id="rs">再玩一次</button>';
 $('rs').onclick=()=>{S.bp=100;S.sc=0;S.miss=[];hud();start()}}
intro();
</script>
